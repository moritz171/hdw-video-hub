<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<style>html,body{background:#0c141e;margin:0;min-height:100vh}</style>
<script>
(function () {
  var base = location.pathname.replace(/index\.html$/i, '').replace(/\/?$/, '/');
  var isMobile = /Android|iPhone|iPad|iPod|IEMobile|BlackBerry|Opera Mini|Mobile/i.test(navigator.userAgent)
    || (window.matchMedia && window.matchMedia('(max-width: 767px)').matches);
  location.replace(base + (isMobile ? 'mobile' : 'desktop'));
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=/123425/desktop"></noscript>
</head><body></body></html>
