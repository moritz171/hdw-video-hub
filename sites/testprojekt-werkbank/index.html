<!DOCTYPE html><html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testprojekt Werkbank</title>
<style>
  :root { --orange: #ff6600; --bg: #0c141e; --card: #18202b; --line: rgba(255,255,255,.1); --text: #dbe3f2; --muted: #8b95a5; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; line-height: 1.5; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 32px 16px 64px; }
  header { border-bottom: 2px solid var(--orange); padding-bottom: 24px; margin-bottom: 32px; }
  .badge { display: inline-block; background: var(--orange); color: #000; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: 4px 10px; border-radius: 2px; }
  h1 { font-size: 28px; line-height: 1.2; margin: 12px 0 0; letter-spacing: -0.01em; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .1em; color: var(--orange); margin: 0 0 16px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 24px; margin-bottom: 24px; }
  .item { display: flex; align-items: center; gap: 14px; padding: 12px; margin: 8px 0; background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 6px; color: var(--text); text-decoration: none; transition: border-color .15s; }
  .item:hover { border-color: var(--orange); }
  .item img { width: 56px; height: 56px; object-fit: cover; border-radius: 4px; background: #fff; flex-shrink: 0; }
  .item span { font-size: 15px; }
  .pdf-btn { display: block; text-align: center; background: var(--orange); color: #000; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 16px; border-radius: 6px; text-decoration: none; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 40px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="badge" data-hdw="video-type">Bauprojekt</span>
    <h1 data-hdw="video-title">Testprojekt Werkbank</h1>
  </header>

  

  

  

  

  

  <footer>Zuletzt aktualisiert: 09.07.2026 · Links können Affiliate-Links sein.</footer>
</div>


</body></html>
